<!-- ================= Mockup-Steuerung (Unterseiten): Leiste + Einstellungs-Panel ================= -->
<div class="stg" id="stg" aria-label="Mockup-Steuerung">
 <div class="stg-hinweis" role="status"><b>Bearbeiten aktiv</b><span>Text anklicken und tippen · Enter beendet</span><button type="button" id="edtFertig">Fertig</button></div>
 <aside class="stg-panel" id="stgPanel" aria-label="Einstellungen">
  <div class="stg-kopf"><b>Einstellungen</b><button type="button" id="stgZu" aria-label="Einstellungen schließen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="stg-inhalt">
   <section class="stg-gr">
    <h5>Ansicht</h5>
    <div class="stg-z"><span>Dunkelmodus</span><button type="button" id="dk" class="tg" aria-label="Dunkelmodus"></button></div>
    <div class="stg-z" data-ziel="#kopf"><span>Kopfleiste</span><div class="seg"><button type="button" data-ks="neu" class="on">Neu</button><button type="button" data-ks="alt">Bisher</button></div></div>
    <div class="stg-z" data-ziel="#kopf"><span>Haupt-Button oben</span><div class="seg"><button type="button" data-kbtn="ticket" class="on" title="Ticket eröffnen als Button, Termin im Support-Menü">Ticket</button><button type="button" data-kbtn="termin" title="Bisher: Termin vereinbaren als Button">Termin</button></div></div>
    <div class="stg-z" data-ziel="footer.fuss"><span>Footer</span><div class="seg"><button type="button" data-fuss="k" class="on" title="Kompakt: alle Angaben in zwei Zeilen (Standard)">K</button><button type="button" data-fuss="a" title="Spalten: Adressen, Kontakt, Linkzeile">A</button></div></div>
    <!-- Heros (Leon 24.11.2026): Höhe, Stil und Wellenart umschaltbar; Wellenart gilt auf allen Seiten (auch Startseite und Kontaktblock) -->
    <div class="stg-z" data-ziel="#top"><span>Hero-Höhe</span><div class="seg"><button type="button" data-heroh="einheitlich" class="on">Einheitlich</button><button type="button" data-heroh="bisher">Bisher</button></div></div>
    <div class="stg-z" data-ziel="#top"><span>Hero-Stil</span><select id="heroStil" aria-label="Hero-Stil"><option value="welle">Wellenkante je Bereich</option><option value="bereich">Ruhig je Bereich (bisher)</option><option value="ruhig">Ruhig</option><option value="schimmer">Schimmer</option><option value="punkte">Punkte</option></select></div>
    <div class="stg-z" data-ziel="#top"><span>Wellenart</span><select id="welleArt" aria-label="Wellenart"></select></div>
    <div class="stg-z" data-ziel="#top"><span>Hero-Buttons</span><div class="seg"><button type="button" data-hbt="alt">Bisher</button><button type="button" data-hbt="neu" class="on">Reduziert</button></div></div>
   </section>
   <section class="stg-gr">
    <h5>Inhalt</h5>
    <div class="stg-z" data-ziel=".stimmen"><span>Kundenstimmen</span><div class="seg"><button type="button" data-kst="kompakt" class="on">Kompakt</button><button type="button" data-kst="buehne">Bühne</button><button type="button" data-kst="liste">Liste</button></div></div>
    <div class="stg-z" data-ziel=".st-reihe"><span>Abläufe</span><div class="seg"><button type="button" data-ablauf="pfeil" class="on" title="Pfeilband: Schritte als Pfeile, die zum Ziel kräftiger werden">Pfeilband</button><button type="button" data-ablauf="zeitleiste" title="Bisher: Zeitleiste mit Linie und Punkten">Zeitleiste</button></div></div>
    <div class="stg-z" id="stgAz" data-ziel=".bk ul, .fragen"><span>Aufzählung</span><div class="seg"><button type="button" data-az="P">Punkt</button><button type="button" data-az="H">Häkchen</button><button type="button" data-az="S">Strich</button><button type="button" data-az="L">Ohne</button></div></div>
    <div class="stg-z" data-ziel="main .hc"><span>Begriff</span><select id="begriff" aria-label="Begriff"><option>Gesundheitswesen</option><option>Healthcare</option></select></div>
   </section>
  </div>
 </aside>
 <div class="stg-bar">
  <button type="button" id="edt" class="stg-btn" title="Texte direkt bearbeiten"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg><span>Bearbeiten</span></button>
  <button type="button" id="sav" class="stg-btn prim" title="Überschreibt diese Datei (Strg+S)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg><span>Speichern</span></button>
  <i></i>
  <button type="button" id="barT" class="stg-btn" title="Einstellungen" aria-expanded="false" aria-controls="stgPanel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Einstellungen</span></button>
 </div>
</div>
