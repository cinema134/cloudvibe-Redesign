<!-- ================= Mockup-Steuerung (Unterseiten): Leiste + Einstellungs-Panel ================= -->
<div class="stg" id="stg" aria-label="Mockup-Steuerung">
 <div class="stg-hinweis" role="status"><b>Bearbeiten aktiv</b><span>Text anklicken und tippen · Enter beendet</span><button type="button" id="edtFertig">Fertig</button></div>
 <aside class="stg-panel" id="stgPanel" aria-label="Einstellungen">
  <div class="stg-kopf"><b>Einstellungen</b><button type="button" id="stgZu" aria-label="Einstellungen schließen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="stg-inhalt">
   <!-- Panel neu (Leon 25.11.2026): Reiter „Diese Seite“ (Abschnitte, Varianten der Seite) · „Design“ (gilt auf allen Seiten) · „Sichern“; Benennung nach dem, was man auf der Seite sieht -->
   <section class="stg-gr" data-tab="design">
    <h5>Darstellung</h5>
    <div class="stg-z"><span>Dunkler Modus</span><button type="button" id="dk" class="tg" aria-label="Dunkler Modus"></button></div>
   </section>
   <section class="stg-gr" data-tab="design">
    <h5>Erster Bildschirm (Hero)</h5>
    <div class="stg-z" data-ziel="#top"><span>Hintergrund</span><select id="heroStil" aria-label="Hintergrund im ersten Bildschirm"><option value="welle">Wellenkante je Bereich</option><option value="bereich">Ruhig je Bereich (bisher)</option><option value="ruhig">Ruhig</option><option value="schimmer">Schimmer</option><option value="punkte">Punkte</option></select></div>
   </section>
   <section class="stg-gr" data-tab="design">
    <h5>Bausteine</h5>
    <div class="stg-z" id="stgAz" data-ziel=".bk ul, .fragen"><span>Aufzählungszeichen</span><div class="seg"><button type="button" data-az="P">Punkt</button><button type="button" data-az="H">Haken</button><button type="button" data-az="S">Strich</button><button type="button" data-az="L">Ohne</button></div></div>
   </section>
   <section class="stg-gr" data-tab="design" data-ziel="#kopf">
    <h5>Logo (gilt auf allen Seiten)</h5>
    <label class="sp">Größe <input id="lgs" type="range" min="30" max="220" value="90"></label>
    <label class="sp">Abstand <input id="lga" type="range" min="0" max="320" value="70"></label>
    <label class="sp">Größe in der Leiste <input id="lgk" type="range" min="40" max="90" value="50"></label>
    <div class="stg-z"><span>Logo frei links</span><button type="button" id="lgb" class="tg on" aria-label="Logo frei"></button></div>
   </section>
  </div>
 </aside>
 <div class="stg-bar">
  <button type="button" id="edt" class="stg-btn" title="Texte direkt bearbeiten"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg><span>Bearbeiten</span></button>
  <button type="button" id="sav" class="stg-btn prim" title="Überschreibt diese Datei (Strg+S)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg><span>Speichern</span></button>
  <i></i>
  <button type="button" id="barT" class="stg-btn" title="Einstellungen" aria-expanded="false" aria-controls="stgPanel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Einstellungen</span></button>
 </div>
</div>
