<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<title>Skizze Karneval</title>
<!-- Skizze (Leon 27.11.2026): Karneval passend zum Niederrhein. Narrenkappe am Logo, Kamelle/Strüssjer/Luftschlangen an den Karten.
     Stil wie Osternest Stufe 3: schlicht, flächig mit weichem Verlauf, wenig Kleinteile. Nur Vergleich, nicht eingebunden.
     Logo kommt aus ../logo.txt (wird beim Rendern eingesetzt). Bild: Mockup/Vergleich/Karneval_Varianten.png -->
<style>
  body{margin:0;font:14px/1.4 "Segoe UI",sans-serif;background:#fff;color:#14171C}
  .reihe{display:grid;gap:0;border-bottom:1px solid #E3E8F0}
  .feld{padding:20px 18px 24px;border-right:1px solid #E3E8F0;position:relative}
  .feld:last-child{border-right:0}
  .dunkel{background:#0B0D10;color:#fff}
  .dunkel .feld{border-color:#252A33}
  h2{margin:0;padding:16px 18px 0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#4F5663}
  .dunkel h2{color:#AEB5C2}
  h3{margin:0 0 4px;font-size:15px}
  p{margin:0 0 12px;font-size:12px;color:#4F5663;min-height:34px}
  .dunkel p{color:#AEB5C2}
  .logo{position:relative;width:300px;height:180px;margin:0 auto}
  .logo img{position:absolute;left:0;bottom:0;width:300px}
  .logo svg{position:absolute;left:0;bottom:0;width:300px;height:auto;overflow:visible}
  .klein{display:flex;gap:26px;align-items:flex-end;justify-content:center;margin-top:10px}
  .klein .logo{width:110px;height:72px}
  .klein .logo img,.klein .logo svg{width:110px}
  .karte{position:relative;margin-top:70px;height:74px;border-radius:30px;border:1px solid #E3E8F0;background:linear-gradient(#fff,#F4F7FC)}
  .dunkel .karte{border-color:#252A33;background:linear-gradient(#121A27,#0E131C)}
  .karte .lieg{position:absolute;bottom:calc(100% - 9px);left:40px;line-height:0}
  .karte .lieg svg{height:64px;width:auto;overflow:visible}
  .karte .ecke{position:absolute;top:-6px;right:26px;line-height:0}
  .karte .ecke svg{height:70px;width:auto;overflow:visible}
  .karte span{position:absolute;left:24px;bottom:16px;font-size:13px;color:#4F5663}
  .dunkel .karte span{color:#AEB5C2}
  .gross{display:flex;justify-content:center;align-items:flex-end;height:120px}
  .gross svg{width:230px;height:auto;overflow:visible}
  .yt{position:relative;width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid #E3E8F0;margin:30px auto 70px;display:grid;place-items:center;font-size:11px;color:#14171C}
  .dunkel .yt{background:#121A27;border-color:#252A33;color:#fff}
  .yt svg{position:absolute;top:100%;left:50%;transform:translateX(-50%);overflow:visible}
</style></head><body>
<h2>Logo</h2>
<div class="reihe" id="logos" style="grid-template-columns:repeat(2,1fr)"></div>
<h2>Karten (liegend auf der Kante bzw. über der Ecke), hell</h2>
<div class="reihe" id="hell" style="grid-template-columns:repeat(3,1fr)"></div>
<div class="dunkel"><h2>Dunkel</h2><div class="reihe" id="dunkel" style="grid-template-columns:repeat(3,1fr)"></div></div>
<script>
const LOGO = 'LOGO';
let gid = 0;
const verlauf = (h, g, d) => { const id = 'v' + (++gid); return [id, `<radialGradient id="${id}" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="${h}"/><stop offset=".5" stop-color="${g}"/><stop offset="1" stop-color="${d}"/></radialGradient>`]; };

/* ---------- Kappe am Logo (Logo 700 × 312, Kappe sitzt wie die Weihnachtsmütze auf dem Übergang linke/große Wolkenbeule) ---------- */
// Elferratskappe: steife Kappe, oben schräg, Band unten, Abzeichen, Federbusch
const kappe = (F) => {
  const [kv, kd] = verlauf(F.hell, F.grund, F.dunkel);
  // Federbusch: drei breite Federn, die aus der linken oberen Ecke der Kappe fächern
  const busch = F.feder.map(([dreh, , c], i) => `<g transform="translate(-26 -66) rotate(${dreh})"><path d="M0 0 Q-15 -38 0 -${76 - i * 6} Q15 -38 0 0 Z" fill="${c}"/><path d="M0 -4 V-${68 - i * 6}" stroke="${F.kiel}" stroke-width="1.4" opacity=".7"/></g>`).join('');
  return `<defs>${kd}</defs>
  <g transform="translate(196 70) rotate(-12) scale(1.3)">
    ${busch}
    <path d="M-56 0 L-46 -64 Q-6 -82 44 -60 L56 0 Z" fill="url(#${kv})"/>
    <path d="M-46 -64 Q-6 -82 44 -60" fill="none" stroke="${F.kante}" stroke-width="4" stroke-linecap="round"/>
    <path d="M-58 -16 H58 V2 Q0 8 -58 2 Z" fill="${F.band}"/>
    <path d="M-58 -16 H58" stroke="${F.linie}" stroke-width="2.4"/><path d="M-58 2 Q0 8 58 2" fill="none" stroke="${F.linie}" stroke-width="2.4"/>
    <g transform="translate(-4 -38)"><circle r="11" fill="${F.abz}"/><circle r="11" fill="none" stroke="${F.abzR}" stroke-width="2"/><path d="M0 -6 L1.8 -1.8 L6.3 -1.8 L2.7 1 L4 5.4 L0 2.8 L-4 5.4 L-2.7 1 L-6.3 -1.8 L-1.8 -1.8 Z" fill="${F.stern}"/></g>
  </g>`;
};
const KAPPEN = {
  A: { t: 'A Elferratskappe Rot-Weiß', p: 'Klassisch rheinisch: rote Kappe, weißes Band mit Goldlinien, goldener Stern, Federbusch weiß und rot.',
    hell: '#E4555B', grund: '#C8323A', dunkel: '#93222A', kante: '#F2F2F2', band: '#F7F7F5', linie: '#C9A94B', abz: '#C9A94B', abzR: '#B08E3A', stern: '#fff',
    kiel: '#C8323A', feder: [[-38, 0, '#fff'], [-14, 0, '#E4555B'], [10, 0, '#fff']] },
  B: { t: 'B Kappe in cloudvibe-Farben', p: 'Gleiche Form in Blau mit grünem Band und Goldstern; Federbusch weiß, grün, blau.',
    hell: '#5B8EF0', grund: '#2D6CDF', dunkel: '#1E4FA8', kante: '#E9F0FC', band: '#3FAE3A', linie: '#C9A94B', abz: '#fff', abzR: '#C9A94B', stern: '#C9A94B',
    kiel: '#1E4FA8', feder: [[-38, 0, '#fff'], [-14, 0, '#4BD545'], [10, 0, '#5B8EF0']] }
};
const logoMit = (k) => `<img src="${LOGO}" alt=""><svg viewBox="0 -120 700 432">${kappe(KAPPEN[k])}</svg>`;
document.getElementById('logos').innerHTML = Object.keys(KAPPEN).map((k) => `<div class="feld"><h3>${KAPPEN[k].t}</h3><p>${KAPPEN[k].p}</p>
  <div class="logo" style="height:185px">${logoMit(k)}</div>
  <div class="klein"><div class="logo">${logoMit(k)}</div><span style="font-size:12px;color:#4F5663">Kopfleiste (ca. 50 px)</span></div></div>`).join('');

/* ---------- Kamelle, Strüssjer, Luftschlangen, Konfetti ---------- */
const kamell = (x, y, dreh, farbe, streifen) => {
  const [v, d] = verlauf(farbe[0], farbe[1], farbe[2]);
  return `<defs>${d}</defs><g transform="translate(${x} ${y}) rotate(${dreh})">
    <path d="M-11 0 L-21 -7 Q-23 0 -21 7 Z" fill="${farbe[1]}"/><path d="M11 0 L21 -7 Q23 0 21 7 Z" fill="${farbe[1]}"/>
    <ellipse rx="12.5" ry="8" fill="url(#${v})"/>
    ${streifen ? `<path d="M-5 -7.5 L-9 7 M2 -8 L-2 8 M9 -6.5 L5 7.5" stroke="#fff" stroke-width="2" opacity=".75"/>` : ''}
    <ellipse cx="-4" cy="-3.5" rx="4" ry="1.8" fill="#fff" opacity=".45"/></g>`;
};
const K = { rot: ['#EE7A7E', '#D2353D', '#9E2730'], gelb: ['#FFE28A', '#F2C230', '#C99A16'], gruen: ['#8FDB8B', '#3FAE3A', '#2A7D27'], blau: ['#8DB2F5', '#2D6CDF', '#1E4FA8'], weiss: ['#FFFFFF', '#F1F1EE', '#CFCFC8'] };
const bluete = (x, y, r, farbe, mitte = '#F2C230') => { let s = ''; for (let i = 0; i < 5; i++) { const a = i * 72 * Math.PI / 180; s += `<circle cx="${(x + Math.sin(a) * r).toFixed(1)}" cy="${(y - Math.cos(a) * r).toFixed(1)}" r="${r * 0.85}" fill="${farbe}"/>`; } return s + `<circle cx="${x}" cy="${y}" r="${r * 0.6}" fill="${mitte}"/>`; };
const struessje = (x, y, dreh) => `<g transform="translate(${x} ${y}) rotate(${dreh})">
  <path d="M0 0 L-3 18 M0 0 L3 18 M0 0 L0 19" stroke="#4E8A4A" stroke-width="2" stroke-linecap="round"/>
  <path d="M-2 4 Q-14 2 -16 -6 Q-6 -6 -2 4 Z" fill="#6F9A6B"/><path d="M2 4 Q14 2 16 -6 Q6 -6 2 4 Z" fill="#7FA97A"/>
  ${bluete(-7, -8, 4.2, '#E4555B')}${bluete(6, -10, 4.2, '#fff')}${bluete(0, -18, 4.6, '#F2C230', '#D2353D')}
  <path d="M-4 13 Q0 10 4 13 L6 21 M-4 13 L-7 21" stroke="#2D6CDF" stroke-width="2.2" fill="none" stroke-linecap="round"/></g>`;
// Luftschlange: lockere Spirale entlang einer Linie
const schlange = (x, y, len, farbe, auf = 1, w = 3) => { let d = `M${x} ${y}`; const n = 3; for (let i = 0; i < n; i++) { const x0 = x + (len / n) * i; d += ` C${x0 + len / n * 0.2} ${y - 12 * auf} ${x0 + len / n * 0.9} ${y - 12 * auf} ${x0 + len / n * 0.55} ${y + 1} C${x0 + len / n * 0.35} ${y + 9 * auf} ${x0 + len / n * 0.95} ${y + 6 * auf} ${x0 + len / n} ${y}`; } return `<path d="${d}" fill="none" stroke="${farbe}" stroke-width="${w}" stroke-linecap="round"/>`; };
const konfetti = (pts) => pts.map(([x, y, c, r]) => r ? `<rect x="${x - 2}" y="${y - 1.2}" width="4" height="2.4" rx=".8" fill="${c}" transform="rotate(${r} ${x} ${y})"/>` : `<circle cx="${x}" cy="${y}" r="1.9" fill="${c}"/>`).join('');
const schatten = (cx, rx) => `<ellipse cx="${cx}" cy="60" rx="${rx}" ry="3" fill="#1B2230" opacity=".14"/>`;

// liegend auf der Kartenkante (viewBox 0 0 128 64, Unterkante ≈ y 58)
const LIEGEND = {
  1: { t: '1 Kamelle und Strüssje', p: 'Fünf Kamelle in Bonbonpapier und ein Strüssje, wie sie beim Zoch fliegen.',
    svg: () => `<svg viewBox="0 0 128 64">${schatten(64, 54)}${struessje(86, 30, 18)}${kamell(22, 50, -8, K.rot, true)}${kamell(48, 52, 6, K.gelb)}${kamell(36, 40, -24, K.gruen)}${kamell(68, 51, -4, K.blau, true)}${kamell(104, 52, 12, K.weiss, true)}</svg>` },
  2: { t: '2 Luftschlangen und Konfetti', p: 'Zwei ruhige Luftschlangen auf der Kante, wenige Konfetti; auf markierten Karten fallen drei über die Ecke.',
    svg: () => `<svg viewBox="0 0 128 64"><path d="M6 56 C26 44 34 60 52 50 C70 40 78 58 98 48 C108 43 116 46 122 52" fill="none" stroke="#D2353D" stroke-width="3" stroke-linecap="round"/><path d="M14 58 C32 52 44 62 62 56 C80 50 92 60 112 56" fill="none" stroke="#F2C230" stroke-width="2.6" stroke-linecap="round"/>${konfetti([[30, 34, '#3FAE3A', 20], [58, 28, '#2D6CDF'], [86, 32, '#D2353D', -30], [108, 30, '#F2C230']])}</svg>` },
  3: { t: '3 Nur Kamelle', p: 'Am schlichtesten: drei Kamelle, kein Grün, keine Schlangen.',
    svg: () => `<svg viewBox="0 0 128 64">${schatten(60, 38)}${kamell(38, 51, -10, K.rot, true)}${kamell(64, 52, 8, K.gelb)}${kamell(52, 40, -22, K.blau, true)}</svg>` }
};
// über die Ecke fallende Luftschlangen (für markierte Karten statt Kugeln) und Anhänger am YouTube-Button
const ecke = () => `<svg viewBox="0 0 70 80"><path d="M10 0 C14 14 2 20 8 32 C14 44 4 52 10 64" fill="none" stroke="#D2353D" stroke-width="3" stroke-linecap="round"/><path d="M30 0 C34 10 24 18 30 28 C36 38 28 44 32 54" fill="none" stroke="#F2C230" stroke-width="3" stroke-linecap="round"/><path d="M50 0 C54 12 44 20 50 34 C56 46 48 56 54 70" fill="none" stroke="#2D6CDF" stroke-width="2.6" stroke-linecap="round"/>${konfetti([[20, 40, '#3FAE3A', 25], [40, 64, '#D2353D'], [62, 46, '#F2C230', -20]])}</svg>`;
const ytAnh = () => `<svg width="30" height="58" viewBox="0 0 30 58"><path d="M15 0 C20 10 8 16 15 26 C22 36 10 42 15 52" fill="none" stroke="#D2353D" stroke-width="2.6" stroke-linecap="round"/>${konfetti([[6, 20, '#F2C230', 20], [24, 34, '#2D6CDF']])}</svg>`;

const zelle = (k) => `<div class="feld"><h3>${LIEGEND[k].t}</h3><p>${LIEGEND[k].p}</p>
  <div class="gross">${LIEGEND[k].svg()}</div>
  <div class="karte"><div class="lieg">${LIEGEND[k].svg()}</div>${k === '2' ? `<div class="ecke">${ecke()}</div>` : ''}<span>Karte (Originalgröße)</span></div>
  ${k === '2' ? '<div class="yt">YT' + ytAnh() + '</div><p style="text-align:center;min-height:0">„Folge uns“: Luftschlange statt Kugel</p>' : ''}</div>`;
for (const id of ['hell', 'dunkel']) document.getElementById(id).innerHTML = ['1', '2', '3'].map(zelle).join('');
</script>
</body></html>
